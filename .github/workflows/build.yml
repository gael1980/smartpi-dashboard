name: Validate and build SmartPI Dashboard

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: cd frontend && npm ci --no-audit --no-fund
      - name: TypeScript verification
        run: cd frontend && npm run typecheck
      - name: Adapter tests
        run: cd frontend && npm test
      - name: Build integration bundle
        run: cd frontend && npm run build
      - name: Structural and read-only tests
        run: python3 -m unittest discover -s tests -v
      - name: Verify committed bundle matches sources
        run: git diff --exit-code -- frontend/package-lock.json custom_components/smartpi_dashboard/frontend/smartpi-dashboard.js
      - name: Browser interaction tests (synthetic data only)
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/smartpi-http.log 2>&1 &
          google-chrome --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/smartpi-chrome --remote-debugging-port=9224 about:blank > /tmp/smartpi-chrome.log 2>&1 &
          SMARTPI_BROWSER_OUTPUT=/tmp/smartpi-browser-evidence node frontend/tests/browser-runner.mjs
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smartpi-browser-evidence
          path: /tmp/smartpi-browser-evidence/
          if-no-files-found: warn
      - name: Upload installable integration
        uses: actions/upload-artifact@v4
        with:
          name: smartpi-dashboard-homeassistant
          path: custom_components/smartpi_dashboard/
          if-no-files-found: error

  home-assistant-lifecycle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m pip install homeassistant==2026.11.0
      - run: python -m unittest discover -s tests -v
