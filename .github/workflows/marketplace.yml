name: Validate Marketplace distribution

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate custom integration
        uses: home-assistant/actions/hassfest@86d4564712fa02543c808e3a693dd04f9d3f8361 # master checked 2026-11-11

  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: Validate repository for the catalog
        uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main checked 2026-11-11
        with:
          category: integration
          comment: false
